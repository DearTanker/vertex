# Dokploy (Docker Compose 模式, 不要用 Stack 模式 —— Stack 不支持 build)
#
# 在 Dokploy 中新建 Compose 服务, Git 源选择本仓库的 test/dokploy 分支,
# Compose Path 填 docker-compose.dokploy.yml 即可。
#
# 与生产实例隔离的关键点:
#   - 端口用 3003 (生产是 3002)
#   - 数据卷用 ../files/vertex-test (Dokploy 官方推荐的持久化目录, 不会随部署被清空)
#   - 服务名不同, 容器名显式前置 vertex-test 避免冲突
#
# 如果想完全复用生产的 /root/vertex 数据 (只测代码不重配站点), 把 volumes 换成:
#   - /root/vertex:/vertex
services:
  vertex-test:
    build:
      context: .
      dockerfile: docker/Dockerfile.test
    image: vertex:test
    container_name: vertex-test
    # 每次部署都重新 build, 否则会复用旧的 vertex:test 镜像
    pull_policy: build
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ../files/vertex-test:/vertex
    ports:
      - "3003:3000"
    networks:
      - dokploy-network
    restart: unless-stopped

networks:
  dokploy-network:
    external: true
