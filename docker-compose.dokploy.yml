# Dokploy (Docker Compose 模式, 不要用 Stack 模式 —— Stack 不支持 build)
#
# 在 Dokploy 中新建 Compose 服务, Git 源选择本仓库的 test/dokploy 分支,
# Compose Path 填 docker-compose.dokploy.yml 即可。
#
# 与生产实例隔离的关键点:
#   - 端口用 3003 (生产是 3002)
#   - 数据卷用 /root/vertex-test (生产是 /root/vertex)
#   - 容器名/项目名由 Dokploy 用服务名决定, 这里显式加前缀避免冲突
services:
  vertex-test:
    build:
      context: .
      dockerfile: docker/Dockerfile.test
    image: vertex:test
    container_name: vertex-test
    pull_policy: build
    environment:
      TZ: Asia/Shanghai
    volumes:
      - /root/vertex-test:/vertex
    ports:
      - "3003:3000"
    networks:
      - dokploy-network
    restart: unless-stopped

networks:
  dokploy-network:
    external: true
